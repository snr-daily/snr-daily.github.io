<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374" role="img" aria-label="决策模型如何接入 Agent。调用方定义选项 → 模型一次前向评分 → 应用使用评分" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="679" height="373" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">决策模型如何接入 Agent</text>
<text x="24.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Microsoft-Decision-1 的结构化评分方式</text>
<rect x="24" y="94.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="118.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="122.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="70.0" y="123.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">调用方定义选项</text>
<text x="70.0" y="143.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">给出需要判断的内容和固定选项，例如继续、停止或转交</text>
<line x1="47" y1="160.0" x2="47" y2="174.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,170.0 L47,176.0 L51,170.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="179.0" width="632" height="63" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1"/>
<circle cx="47" cy="203.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="207.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="70.0" y="208.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">模型一次前向评分</text>
<text x="70.0" y="228.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">返回各选项的校准概率，不生成开放式回答</text>
<line x1="47" y1="245.0" x2="47" y2="259.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,255.0 L47,261.0 L51,255.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="264.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="288.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="292.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="70.0" y="293.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">应用使用评分</text>
<text x="70.0" y="313.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">用于路由、分类、校验或工作流控制</text>
<text x="24.0" y="350.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">根据微软发布说明及 OpenRouter 模型页整理。应用仍需自行执行权限与安全规则。</text>
</svg>
