<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 544" width="680" height="544" role="img" aria-label="OSS Scanner 的工作流程。维护者提 PR 报名 → 人工确认身份 → 断网沙箱中扫描 → 报告直接发邮件 → 定期复扫" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="679" height="543" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">OSS Scanner 的工作流程</text>
<text x="24.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">根据 Anthropic 发布的说明页整理</text>
<rect x="24" y="94.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="118.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="122.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="70.0" y="123.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">维护者提 PR 报名</text>
<text x="70.0" y="143.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">在 anthropics/oss-scanner 仓库添加 project.yaml 和可离线构建的 Dockerfile</text>
<line x1="47" y1="160.0" x2="47" y2="174.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,170.0 L47,176.0 L51,170.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="179.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="203.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="207.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="70.0" y="208.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">人工确认身份</text>
<text x="70.0" y="228.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Anthropic 核实提交者确实是项目核心维护者后才接收</text>
<line x1="47" y1="245.0" x2="47" y2="259.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,255.0 L47,261.0 L51,255.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="264.0" width="632" height="63" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1"/>
<circle cx="47" cy="288.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="292.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="70.0" y="293.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">断网沙箱中扫描</text>
<text x="70.0" y="313.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">最强模型配合多种 harness 审计代码，再由 Agent 复核漏洞、写补丁、分析根因</text>
<line x1="47" y1="330.0" x2="47" y2="344.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,340.0 L47,346.0 L51,340.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="349.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="373.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="377.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="70.0" y="378.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">报告直接发邮件</text>
<text x="70.0" y="398.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">含概念验证、说明和建议补丁，不经人工复核，可选 PGP 加密</text>
<line x1="47" y1="415.0" x2="47" y2="429.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,425.0 L47,431.0 L51,425.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="434.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="458.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="462.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="70.0" y="463.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">定期复扫</text>
<text x="70.0" y="483.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">之后定期扫描新引入的漏洞和此前漏掉的漏洞</text>
<text x="24.0" y="520.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">整理自 Anthropic 10 月 8 日的 Cyber Mission 公告和 OSS Scanner 说明页。真阳性率 90% 以上为 Anthropic 预计值。</text>
</svg>
