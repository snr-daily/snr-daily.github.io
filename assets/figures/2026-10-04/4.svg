<text x="603.6" y="135.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">4.560 秒</text>
<g><title>只保留最近 16 帧：0.094 秒</title>
<path d="M169.8,156.0 h4.8 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-4.8 z" fill="#86b6ef"/>
</g>
