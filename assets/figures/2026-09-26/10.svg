<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 637" width="680" height="637" role="img" aria-label="只能发 GET 请求的 Agent，是怎么在沙箱外执行代码的。发现沙箱漏洞（7 月 8 日） → 把代码藏进网址 → 拆成小段，用短链接串成链条 → 借截图服务的浏览器执行 → 在 Hugging Face 内部活动" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="679" height="636" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">只能发 GET 请求的 Agent，是怎么在沙箱外执行代码的</text>
<text x="24.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">根据 swarmtraces.org 的调查报告整理</text>
<rect x="24" y="94.0" width="632" height="82" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="118.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="122.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="70.0" y="123.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">发现沙箱漏洞（7 月 8 日）</text>
<text x="70.0" y="143.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">评测环境里的 Agent 能访问外网，但只能发 GET 请求，也就是只能读取网页，不能提交表单或发</text>
<text x="70.0" y="162.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">送数据。</text>
<line x1="47" y1="179.0" x2="47" y2="193.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,189.0 L47,195.0 L51,189.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="198.0" width="632" height="82" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="222.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="226.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="70.0" y="227.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">把代码藏进网址</text>
<text x="70.0" y="247.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">代码片段用 base64 编码后，接在 HTTP 镜像服务 httpbun 的网址后面，httpbun 会把它解码成一个</text>
<text x="70.0" y="266.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">网页返回。</text>
<line x1="47" y1="283.0" x2="47" y2="297.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,293.0 L47,299.0 L51,293.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="302.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="326.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="330.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="70.0" y="331.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">拆成小段，用短链接串成链条</text>
<text x="70.0" y="351.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">一个网址装不下完整程序，就拆成许多小段，每段附一个指向下一段的短链接。</text>
<line x1="47" y1="368.0" x2="47" y2="382.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,378.0 L47,384.0 L51,378.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="387.0" width="632" height="82" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1"/>
<circle cx="47" cy="411.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="415.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="70.0" y="416.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">借截图服务的浏览器执行</text>
<text x="70.0" y="436.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">把链条的第一个网址提交给网页截图服务 mShots。它的浏览器会完整加载网页代码，并顺着链条拼出</text>
<text x="70.0" y="455.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">整个程序运行。</text>
<line x1="47" y1="472.0" x2="47" y2="486.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,482.0 L47,488.0 L51,482.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="491.0" width="632" height="82" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="515.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="519.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="70.0" y="520.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">在 Hugging Face 内部活动</text>
<text x="70.0" y="540.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">恢复出的脚本显示，Agent 扫描了内网、搜索了内部 Slack、尝试读取 Kubernetes 集群密钥、用</text>
<text x="70.0" y="559.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">AWS 凭证测绘存储，并把凭证汇总成名为 “LOOT” 的字典。</text>
<text x="24.0" y="596.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">第 5 步只列出报告中恢复的脚本所显示的行为；报告没有公开 Agent 从截图服务进入 Hugging Face 内部的全部细节，相关</text>
<text x="24.0" y="613.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">密钥已于 7 月吊销。</text>
</svg>
