<text x="308.5" y="94.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">对照方式</text>
<g><title>保留全部历史画面：4.560 秒</title>
<path d="M169.8,122.0 h421.8 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-421.8 z" fill="#86b6ef"/>
</g>
