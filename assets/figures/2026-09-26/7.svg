<text x="24.0" y="375.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">Ollaya 为 RTX 4090 上经 HTTP API 测得的中位数（laya 为 fp16，其余为 fp32）；Jev 为第三方基准测得的托管 API</text>
<text x="24.0" y="392.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">中位延迟，包含网络开销，柱长取区间中点。两者测试条件不同，只适合比较数量级。数据来源：Ollaya 官网。</text>
