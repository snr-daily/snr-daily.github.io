<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 297" width="680" height="297" role="img" aria-label="Nemotron-3-Nano-CC 在 IOI 2025 上的得分变化。后训练前 130；SFT 后 280；RL 后 291；加 GenCorrect 468" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="679" height="296" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">Nemotron-3-Nano-CC 在 IOI 2025 上的得分变化</text>
<text x="24.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">满分 600，金牌线 438.3</text>
<rect x="24" y="84" width="12" height="12" rx="3" fill="#2a78d6"/>
<text x="42.0" y="94.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">越过金牌线</text>
<rect x="126.5" y="84" width="12" height="12" rx="3" fill="#86b6ef"/>
<text x="144.5" y="94.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">未到金牌线</text>
<g><title>后训练前：130</title>
<path d="M134.1,122.0 h132.1 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-132.1 z" fill="#86b6ef"/>
</g>
<text x="24.0" y="135.5" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">后训练前</text>
<text x="278.2" y="135.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">130</text>
<g><title>SFT 后：280</title>
<path d="M134.1,156.0 h289.2 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-289.2 z" fill="#86b6ef"/>
</g>
<text x="24.0" y="169.5" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">SFT 后</text>
<text x="435.3" y="169.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">280</text>
<g><title>RL 后：291</title>
<path d="M134.1,190.0 h300.7 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-300.7 z" fill="#86b6ef"/>
</g>
<text x="24.0" y="203.5" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">RL 后</text>
<text x="446.8" y="203.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">291</text>
<g><title>加 GenCorrect：468</title>
<path d="M134.1,224.0 h486.0 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-486.0 z" fill="#2a78d6"/>
</g>
<text x="24.0" y="237.5" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">加 GenCorrect</text>
<text x="632.2" y="237.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">468</text>
<line x1="134.12000000000003" y1="114" x2="134.12000000000003" y2="250" stroke="#c3c2b7" stroke-width="1"/>
<text x="24.0" y="273.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">数据来自 NVIDIA 10 月 7 日的 Hugging Face 博客。同样策略下更大的 Ultra-CC 得 502 分。</text>
