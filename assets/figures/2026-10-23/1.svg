<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 229" width="680" height="229" role="img" aria-label="OlmoEarth：27 项评测中的领先项数。128 维嵌入 20 / 27；64 维嵌入 18 / 27" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="679" height="228" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">OlmoEarth：27 项评测中的领先项数</text>
<text x="24.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">作者与 AlphaEarth、Tessera v2 对照；不是准确率</text>
<rect x="24" y="84" width="12" height="12" rx="3" fill="#2a78d6"/>
<text x="42.0" y="94.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">128 维嵌入</text>
<rect x="126.5" y="84" width="12" height="12" rx="3" fill="#86b6ef"/>
<text x="144.5" y="94.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">对照项</text>
<g><title>128 维嵌入：20 / 27</title>
<path d="M105.5,122.0 h491.8 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-491.8 z" fill="#2a78d6"/>
</g>
<text x="24.0" y="135.5" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">128 维嵌入</text>
<text x="609.3" y="135.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">20 / 27</text>
<g><title>64 维嵌入：18 / 27</title>
<path d="M105.5,156.0 h442.2 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-442.2 z" fill="#86b6ef"/>
</g>
<text x="24.0" y="169.5" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">64 维嵌入</text>
<text x="559.7" y="169.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">18 / 27</text>
<line x1="105.5" y1="114" x2="105.5" y2="182" stroke="#c3c2b7" stroke-width="1"/>
<text x="24.0" y="205.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">依据 Ai2 同一组评测；两种维度的领先数不等于所有任务提升幅度，未独立复跑。</text>
</svg>
