<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 355" width="680" height="355" role="img" aria-label="Avalon Windows 构建的部署条件。准备模型与系统内存 → 配置 Windows 与 NVIDIA 环境 → 按量化版本启动" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="679" height="354" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">Avalon Windows 构建的部署条件</text>
<rect x="24" y="75.0" width="632" height="63" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1"/>
<circle cx="47" cy="99.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="103.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="70.0" y="104.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">准备模型与系统内存</text>
<text x="70.0" y="124.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">模型另行下载；系统内存需大于模型文件</text>
<line x1="47" y1="141.0" x2="47" y2="155.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,151.0 L47,157.0 L51,151.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="160.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="184.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="188.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="70.0" y="189.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">配置 Windows 与 NVIDIA 环境</text>
<text x="70.0" y="209.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">AVX2 CPU、CUDA 13.4 驱动、x64 VC++ 运行库</text>
<line x1="47" y1="226.0" x2="47" y2="240.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,236.0 L47,242.0 L51,236.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="245.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="269.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="273.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="70.0" y="274.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">按量化版本启动</text>
<text x="70.0" y="294.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">专家权重位于系统内存，其余部分在 GPU 运行</text>
<text x="24.0" y="331.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">根据 windows-v1 发布说明自绘。作者实测为 16 GB 显存与 192 GB 系统内存。</text>
</svg>
