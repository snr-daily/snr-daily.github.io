<text x="186.5" y="169.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">0.094 秒</text>
<g><title>最近 16 帧加文字记忆：0.124 秒</title>
<path d="M169.8,190.0 h7.6 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-7.6 z" fill="#2a78d6"/>
</g>
<text x="24.0" y="203.5" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">最近 16 帧加文字记忆</text>
<text x="189.3" y="203.5" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">0.124 秒</text>
<line x1="169.76" y1="114" x2="169.76" y2="216" stroke="#c3c2b7" stroke-width="1"/>
<text x="24.0" y="239.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">只保留最近 16 帧最快，但会丢掉更早的信息。来源为论文 arXiv 2610.01762 表 4。</text>
