<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">OneStreamer 三种历史保留方式的首字延迟</text>
<text x="24.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">360 秒视频样本，单块 H200，秒，越低越好</text>
<rect x="24" y="84" width="12" height="12" rx="3" fill="#2a78d6"/>
<text x="42.0" y="94.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">最近 16 帧加文字记忆（OneStreamer）</text>
