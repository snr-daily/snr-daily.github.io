<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 544" width="680" height="544" role="img" aria-label="OpenAI 披露的蒸馏行动时间线。7 月 1 日 低量试探 → 7 月 24–25 日 请求激增 → 7 月 28 日 完全阻断 → 进一步调查 → 修补接口" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
<rect x="0.5" y="0.5" width="679" height="543" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24.0" y="41.0" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">OpenAI 披露的蒸馏行动时间线</text>
<text x="24.0" y="63.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">根据 The Hacker News、SC Media 对 OpenAI 公告的报道整理</text>
<rect x="24" y="94.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="118.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="122.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="70.0" y="123.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">7 月 1 日 低量试探</text>
<text x="70.0" y="143.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">活动开始，请求量很小。</text>
<line x1="47" y1="160.0" x2="47" y2="174.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,170.0 L47,176.0 L51,170.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="179.0" width="632" height="63" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1"/>
<circle cx="47" cy="203.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="207.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="70.0" y="208.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">7 月 24–25 日 请求激增</text>
<text x="70.0" y="228.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">4000 多个用户发出约 1.6 万次带套取模式的请求，让受保护的推理以可见形式被复述。</text>
<line x1="47" y1="245.0" x2="47" y2="259.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,255.0 L47,261.0 L51,255.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="264.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="288.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="292.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="70.0" y="293.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">7 月 28 日 完全阻断</text>
<text x="70.0" y="313.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">封禁欺诈账号，部署额外的缓解措施。</text>
<line x1="47" y1="330.0" x2="47" y2="344.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,340.0 L47,346.0 L51,340.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="349.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="373.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="377.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="70.0" y="378.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">进一步调查</text>
<text x="70.0" y="398.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">在 1.5 万多个用户身上发现相关提示模式，核心账号群被归到与月之暗面有关的个人。</text>
<line x1="47" y1="415.0" x2="47" y2="429.0" stroke="#898781" stroke-width="1.5"/>
<path d="M43,425.0 L47,431.0 L51,425.0" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="24" y="434.0" width="632" height="63" rx="8" fill="#f3f2ee"/>
<circle cx="47" cy="458.0" r="11" fill="#2a78d6"/>
<text x="47.0" y="462.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="70.0" y="463.0" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">修补接口</text>
<text x="70.0" y="483.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">关闭加密推理内容可被重放还原的通路，流式输出疑似暴露推理时先拦截。</text>
<text x="24.0" y="520.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">归因是 OpenAI 单方面的说法，未公布技术证据。来源：The Hacker News、SC Media。</text>
</svg>
