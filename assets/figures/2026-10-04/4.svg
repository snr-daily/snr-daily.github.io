<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 263" width="680" height="263" role="img" aria-label="OneStreamer 三种历史保留方式的首字延迟。保留全部历史画面 4.560 秒；只保留最近 16 帧 0.094 秒；最近 16 帧加文字记忆 0.124 秒" font-family="system-ui, -apple-system, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif">
